<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>效果图 · 旧桥营地之夜 · 原生 1080p</title>
<!-- HUD 复用游戏本体的样式，和像素版效果图是同一套面板与配色，只有画布从像素矩形换成了原生分辨率的矢量绘制 -->
<link rel="stylesheet" href="../style.css">
<style>
  /* 画布 1920×1080 逻辑等于物理，不放大也不 pixelated；视口按 1080p 截图时正好铺满 */
  .mock-stage{position:absolute;inset:0;overflow:hidden;background:#0e161b}
  #scene{display:block;width:1920px;height:1080px;image-rendering:auto}
  .mock-tag{position:absolute;transform:translate(-50%,-100%);padding:2px 8px;font-size:12px;line-height:1.4;white-space:nowrap;background:#0f171de6;border:1px solid var(--line);border-left:2px solid var(--gold);color:var(--ink);pointer-events:none}
  .mock-tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:6px;background:var(--gold)}
  .mock-place{width:auto;max-width:360px}
  .mock-clockline{display:flex;gap:8px;align-items:baseline;font:700 14px/1.3 ui-monospace,Menlo,monospace}
  .mock-clockline i{font-style:normal;color:var(--line)}
  .mock-clockline .gold{color:var(--gold)}
  /* 头像与图标按 2 倍分辨率画再缩到面板尺寸，边缘是抗锯齿而不是像素阶梯 */
  .portrait{width:32px;height:38px;image-rendering:auto}
  .hotslot-art{image-rendering:auto}
  .chip.bad{color:var(--bad);border-color:var(--bad)}
  .chip.warm{color:var(--gold);border-color:var(--gold)}
  .chip.wish{color:var(--paper);border-style:dashed}
  .hud-actions{grid-template-rows:auto}
</style>
</head>
<body>
<div class="game-screen">
  <div class="mock-stage">
    <canvas id="scene" width="1920" height="1080" aria-label="旧桥营地剖面效果图，原生 1080p"></canvas>
    <div class="mock-tag" style="left:1119px;top:804px">物资箱 · 3 份饭</div>
    <div class="mock-tag" style="left:1376px;top:686px">篝火 · 燃料 2 格</div>
    <div class="mock-tag" style="left:320px;top:774px">晾晒架 · 明早干</div>
  </div>

  <div class="hud hud-place mock-place">
    <h2>旧桥营地</h2>
    <small>第2章 · 桥下有了床 · 门口那条路今晚没人走</small>
  </div>

  <div class="hud hud-clock">
    <div class="mock-clockline"><b>第 12 夜</b><i>·</i><span>21:00</span><i>·</i><span>雨</span><i>·</i><b class="gold">¥86</b></div>
  </div>

  <aside class="hud hud-party" aria-label="三名主角">
    <div class="char-card" style="--who:#71bfc3">
      <div class="char-head"><canvas class="portrait" width="64" height="76" data-who="xuan" data-mood="hungry"></canvas><div><div class="char-name">轩哥</div><div class="role">在修那台收音机</div></div></div>
      <div class="condrow"><span class="chip bad">饿了</span><span class="chip wet">湿透</span></div>
    </div>
    <div class="char-card" style="--who:#dda45d">
      <div class="char-head"><canvas class="portrait" width="64" height="76" data-who="fan" data-mood="sad"></canvas><div><div class="char-name">凡哥</div><div class="role">躺着，背对着火</div></div></div>
      <div class="condrow"><span class="chip">低落</span><span class="chip wish">想被认真看</span></div>
    </div>
    <div class="char-card" style="--who:#b1bd83">
      <div class="char-head"><canvas class="portrait" width="64" height="76" data-who="ma" data-mood="normal"></canvas><div><div class="char-name">马哥</div><div class="role">守着火，抽烟</div></div></div>
      <div class="condrow"><span class="chip warm">暖和</span><span class="chip wish">想打牌</span></div>
    </div>
  </aside>

  <div class="hud hud-bottom">
    <div class="hud-talk">
      <div class="quote"><b>马哥</b><span>火别灭，前半夜我守。</span></div>
      <div class="journal"><b>街头记事</b><div class="journal-text">凡哥把画收进了包裹，一句话没说。晾的衣服明早才干，轩哥今晚只能穿湿的。</div></div>
    </div>
    <div class="hud-hotbar" aria-label="快捷物品">
      <button type="button" class="hotslot"><canvas class="hotslot-art" width="80" height="80" data-kind="can"></canvas><span class="hotslot-count">3</span></button>
      <button type="button" class="hotslot"><canvas class="hotslot-art" width="80" height="80" data-kind="bandage"></canvas><span class="hotslot-count">1</span></button>
      <button type="button" class="hotslot empty" aria-label="空槽"></button>
    </div>
    <div class="hud-actions">
      <button type="button">安排行动</button>
      <button type="button" class="primary">结束这一晚</button>
    </div>
  </div>
</div>
<script type="module" src="./camp-target-1080.js"></script>
</body>
</html>
