<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今晚睡哪儿</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/title.css">
<link rel="stylesheet" href="/ui/camp-night.css">
<link rel="stylesheet" href="/ui/saves.css">
<link rel="stylesheet" href="/ui/work-games.css">
<link rel="stylesheet" href="/ui/life.css">
<link rel="preload" as="image" href="/art/title-wide-20260918.png" media="(min-width:701px)">
<link rel="preload" as="image" href="/art/title-portrait-20260918.png" media="(max-width:700px)">
</head>
<body>
<div id="title" class="screen title-screen">
  <div class="title-inner">
    <div class="title-mark" aria-hidden="true"></div>
    <div class="eyebrow">THREE LIVES / ONE HUNDRED DAYS</div>
    <h1>今晚睡哪儿</h1>
    <p class="subtitle">轩哥、凡哥、马哥 · 三人的街头100日</p>
    <p class="tagline">活着需要饭、床、干净衣服和药。继续活下去，还需要一点真正想做的事。</p>
    <div class="title-menu">
      <button id="btnContinue" class="primary big">继续上次</button>
      <button id="btnNew" class="big">新开局</button>
      <button id="btnImport" class="big">导入存档</button>
      <button id="btnHelp" class="big">玩法说明</button>
    </div>
    <div class="title-foot">
      <span id="titleSaveInfo"></span>
      <span id="titleAi"></span>
    </div>
    <p class="disclaimer">所有数值、药品作用、心理危机和博彩分布都是虚构游戏规则；无充值、无真钱。人物均为虚构成年人。</p>
  </div>
</div>

<div id="game" class="screen game-screen hidden">
  <!-- 街景铺满视口，其余信息全部以 HUD 面板叠在画面四角；热点按百分比定位，所以 overlay 必须与画布同在 .stage-view 里 -->
  <div class="map-wrap stage" id="mapWrap">
    <div class="stage-view">
      <canvas id="map" width="960" height="540" aria-label="像素城市地图"></canvas>
      <div id="mapOverlay" class="map-overlay"></div>
      <canvas id="street" width="960" height="540" aria-label="横向街道"></canvas>
      <div id="streetOverlay" class="street-overlay"></div>
      <div id="streetTransition" class="street-transition" aria-live="polite"></div>
    </div>

    <div class="hud hud-place">
      <h2 id="mapTitle">雾城 · 街区地图</h2>
      <small id="mapHint">点街区安排行动；推进后人物会自己走过去</small>
      <div class="hud-place-btns">
        <button id="overviewMode" type="button" aria-pressed="true" aria-label="打开地图总览，快捷键 M">地图 M</button>
        <button id="streetMode" type="button" aria-pressed="false">街道</button>
        <button data-open="events">热点 <b id="eventCount">0</b></button>
      </div>
      <div class="chapterline" id="chapterLine"></div>
      <div id="taskStrip" class="task-strip" aria-label="当前任务"></div>
    </div>

    <div class="hud hud-clock">
      <div class="topstats">
        <div class="stat-chip"><small>日</small><b id="tDay"></b></div>
        <div class="stat-chip"><small>回合</small><b id="tTurn"></b></div>
        <div class="stat-chip clock-chip"><small id="clockStatus">时间流逝</small><b id="tSlot"></b></div>
        <div class="stat-chip"><small>天气</small><b id="tWeather"></b></div>
        <div class="stat-chip gold"><small>公共现金</small><b id="tCash"></b></div>
        <div class="stat-chip"><small>有效食物</small><b id="tFood"></b></div>
        <div class="stat-chip warn" id="tCareChip"><small>待护理</small><b id="tCare"></b></div>
      </div>
      <div class="hud-sys">
        <button id="btnMenu" type="button">菜单 E</button>
        <button id="btnSound" title="点击切换：关/低/中/高">声音：低</button>
        <button id="btnSaves" type="button">存档表</button>
        <button id="btnTitle">标题</button>
        <span id="sharedSaveStatus" class="small muted"></span>
      </div>
    </div>

    <aside class="hud hud-party" id="characters" aria-label="三名主角"></aside>

    <div class="hud hud-bottom">
      <div class="hud-talk">
        <div class="quote"><b id="speaker"></b><span id="quote"></span></div>
        <div class="journal" role="status" aria-live="polite"><b>街头记事</b><div id="journal" class="journal-text"></div><button data-open="logs" class="linkbtn">全部</button></div>
      </div>
      <div id="hotbar" class="hud-hotbar" aria-label="快捷物品"></div>
      <div class="hud-actions">
        <button id="btnAiPlan" type="button" title="给其他队友排满今天余下的每个小时，让他们自己行动">AI安排队友全天</button>
        <button id="planToggle" type="button" aria-controls="plannerWindow" aria-expanded="false" aria-label="为三个人安排行动" title="打开行动安排；地图上也可直接点击人物和地点">安排行动</button>
        <button id="btnAdvance" class="primary" title="立即完成当前一小时">开始行动</button>
        <button id="btnEndDay" type="button" title="所有人余下的小时自动随机安排，直接过到夜里">结束今天</button>
      </div>
    </div>

    <div id="streetControls" class="hud hud-walk" hidden><label>查看街区 <select id="streetDistrict"></select></label><span id="streetStatus"></span><div class="street-walk"><button id="walkLeft" type="button" aria-label="向左走" title="向左走">←</button><button id="walkUp" type="button" aria-label="向上走" title="向上走">↑</button><button id="walkDown" type="button" aria-label="向下走" title="向下走">↓</button><button id="walkRight" type="button" aria-label="向右走" title="向右走">→</button></div><div id="streetExits" class="street-exits"></div></div>
  </div>

  <div id="plannerOverlay" class="planner-overlay" hidden>
    <section id="plannerWindow" class="planner-window" role="dialog" aria-modal="true" aria-labelledby="plannerWindowTitle" tabindex="-1">
      <header class="planner-window-head"><h2 id="plannerWindowTitle">今天，几个人怎么过？</h2><nav class="menu-tabs" data-menu-nav><button type="button" data-menu-tab="plan">排程</button><button type="button" data-menu-tab="inventory">库存</button><button type="button" data-menu-tab="wishes">愿望</button><button type="button" data-menu-tab="health">健康</button><button type="button" data-menu-tab="tasks">任务</button><button type="button" data-menu-tab="map">地图</button><button type="button" data-menu-tab="camp">营地</button><button type="button" data-menu-tab="chapters">章节</button><button type="button" data-menu-tab="system">存档</button><button type="button" data-menu-tab="help">说明</button></nav><button type="button" class="primary" data-advance title="立即完成当前一小时">开始行动</button><button id="plannerClose" type="button" aria-label="关闭行动安排">关闭</button></header>
      <div id="plannerWindowBody" class="planner-window-body">
    <aside class="drawer" id="drawer" role="region" aria-label="选择下一件事" hidden></aside>

    <section class="planner" id="planner" role="region" aria-label="三人下一件事" hidden>
      <div class="plan-header">
        <div><h2>三个人的下一件事</h2><p id="planFocus"></p></div>
        <div class="plan-tools">
          <button data-open="inventory">库存</button>
          <button data-open="wishes">愿望与约定</button>
          <button data-open="health">健康护理</button>
        </div>
      </div>
      <div id="schedule" class="schedule" aria-label="三个人的下一件事"></div>
      <div class="plan-footer">
        <div id="planStatus" class="plan-status"></div>
      </div>
    </section>
      </div>
    </section>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalOverlay" class="modal-overlay">
  <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button id="modalClose" class="close" aria-label="关闭">×</button>
    <nav id="modalTabs" class="menu-tabs" hidden><button type="button" data-menu-tab="plan">排程</button><button type="button" data-menu-tab="inventory">库存</button><button type="button" data-menu-tab="wishes">愿望</button><button type="button" data-menu-tab="health">健康</button><button type="button" data-menu-tab="tasks">任务</button><button type="button" data-menu-tab="map">地图</button><button type="button" data-menu-tab="camp">营地</button><button type="button" data-menu-tab="chapters">章节</button><button type="button" data-menu-tab="system">存档</button><button type="button" data-menu-tab="help">说明</button></nav>
    <div id="modalContent"></div>
  </section>
</div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
